name: RAKSHA VIGIL CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  active-runtime-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Node for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: make install
      - name: Python tests
        run: python3 tools/run_phase4_pytest.py
      - name: Browser tests
        run: python3 tools/run_phase4_node_tests.py
      - name: Infra HTTP smoke
        run: python3 tools/run_infra_smoke.py
      - name: Fake-hospital demo smoke
        run: python3 tools/run_hospital_demo_smoke.py
      - name: VIGIL runtime tests
        run: python3 tools/run_vigil_tests.py
      - name: VIGIL HTTP smoke
        run: python3 tools/run_vigil_smoke.py
      - name: Weights manifest
        run: python3 tools/check_vigil_assets.py
      - name: Retired-code purge
        run: python3 tools/check_code_purge.py
      - name: Eval drift
        run: python3 tools/check_eval_drift.py
      - name: Ledger verify
        run: python3 tools/verify_runtime_ledger.py
      - name: Boot-manifest check
        run: python3 tools/check_boot_manifest.py
      - name: No secrets
        run: python3 tools/check_no_secrets.py
      - name: No live-executor imports
        run: python3 tools/check_no_live_executor.py
      - name: Claims ledger verify
        run: python3 tools/check_claims_ledger.py
      - name: Local links
        run: python3 tools/check_local_links.py
      - name: Full active integration gate
        run: make ci
